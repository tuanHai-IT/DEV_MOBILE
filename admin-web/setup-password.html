<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src https://identitytoolkit.googleapis.com; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>EcoShare · Đặt mật khẩu quản trị</title>
  <link rel="stylesheet" href="backend.css">
</head>
<body>
  <main>
    <section class="card login">
      <p class="eyebrow">ECOSHARE / TÀI KHOẢN QUẢN TRỊ</p>
      <h1>Đặt mật khẩu của bạn</h1>
      <p id="setup-status" role="status" aria-live="polite">Đang kiểm tra liên kết…</p>
      <p id="setup-email"></p>
      <form id="password-form" hidden>
        <label for="new-password">Mật khẩu mới</label>
        <input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="4096" required disabled>
        <label for="confirm-password">Nhập lại mật khẩu</label>
        <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="4096" required disabled>
        <button id="set-password" type="submit" disabled>Lưu mật khẩu</button>
      </form>
      <p>Mật khẩu được gửi trực tiếp đến Firebase qua HTTPS. Bạn không cần gửi mật khẩu trong cuộc trò chuyện.</p>
      <a id="setup-success" href="index.html" hidden>Đăng nhập Admin Panel →</a>
    </section>
  </main>
  <script type="module" src="setup-password.js"></script>
</body>
</html>
